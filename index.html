<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#181513">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift Board">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Lift Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ranchers&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div id="splash" aria-label="Lift Board"><svg viewBox="0 0 1024 1024" aria-hidden="true"><g class="sall"><rect x="96" y="494" width="832" height="36" rx="18" fill="#e9b69b"/><rect class="spc" x="302" y="452" width="28" height="120" rx="12" fill="#edeae8"/><rect class="sp l sp0" x="224" y="292.0" width="70" height="440" rx="26" fill="#6fd0b4"/><rect class="sp l sp1" x="154" y="347.0" width="58" height="330" rx="26" fill="#fc96bf"/><rect class="sp l sp2" x="94" y="397.0" width="48" height="230" rx="24.0" fill="#fea06a"/><rect class="spc" x="694" y="452" width="28" height="120" rx="12" fill="#edeae8"/><rect class="sp r sp0" x="730" y="292.0" width="70" height="440" rx="26" fill="#6fd0b4"/><rect class="sp r sp1" x="812" y="347.0" width="58" height="330" rx="26" fill="#fc96bf"/><rect class="sp r sp2" x="882" y="397.0" width="48" height="230" rx="24.0" fill="#fea06a"/></g></svg><div class="sword">LIFT BOARD</div></div>
<div class="wrap">
  <section id="view" aria-live="polite"></section>
  <div class="foot" id="foot">
    <button class="btn" id="resetDay" type="button">Reset day</button>
    <span id="confirmBox" hidden><button class="btn danger" id="confirmReset" type="button">Yes, reset</button> <button class="btn" id="cancelReset" type="button">Cancel</button></span>
    <span class="small" id="saved"></span>
  </div>
</div>
<nav class="bnav" id="bnav" aria-label="Main" hidden></nav>
<div id="rest" role="timer" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="pop" role="dialog" hidden></div>
<div id="sheet" role="status" aria-live="polite" hidden></div>
<div id="tour" hidden></div>
<div id="done" hidden></div>
<div id="confirm" hidden></div>
<div id="coach" role="dialog" aria-live="polite" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
