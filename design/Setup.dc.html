<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lift Board · Setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ranchers&amp;family=Noto+Sans:wght@400;500;600&amp;family=Noto+Sans+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-synthesis-weight:none}
a{color:#fea06a}a:hover{color:#edeae8}
@keyframes lbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lbInB{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lbPop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes lbSheet{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes lbSheetOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(28px)}}
@keyframes lbFade{from{opacity:0}to{opacity:1}}
@keyframes lbFadeOut{from{opacity:1}to{opacity:0}}
@keyframes lbCheck{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes lbDraw{from{stroke-dashoffset:var(--len,60)}to{stroke-dashoffset:0}}
button,a,input,section,span,div{transition:background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease,transform .12s ease}
button:active,a:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div style="width: 390px; height: 1300px; box-sizing: border-box; background: #181513; color: #edeae8; font-family: 'Noto Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.45; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; animation: lbIn .38s cubic-bezier(.2,.8,.2,1) both">
  <h1 style="margin: 0; font-family: 'Ranchers', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 34px; line-height: 1; text-transform: uppercase">Lift Board</h1>
  <nav style="display: flex; gap: 6px; padding: 8px 0" aria-label="Tabs">
    <a href="Setup.dc.html" style="flex: 0 0 auto; font-family: 'Ranchers', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; border: 1px solid #9d5324; background: #9d5324; color: #fff; padding: 7px 13px; border-radius: 999px; text-decoration: none" aria-current="page">Setup</a>
    <a href="Main.dc.html" style="flex: 0 0 auto; font-family: 'Ranchers', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; border: 1px solid transparent; background: #24201d; color: #edeae8; padding: 7px 13px; border-radius: 999px; text-decoration: none">This week</a>
  </nav>
  <h2 style="margin: 0; font-family: 'Ranchers', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: .02em">Setup</h2>

  <section style="background: #24201d; border-radius: 12px; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px">
    <div style="position: relative"><h3 style="margin: 0; font-family: 'Ranchers', sans-serif; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center">Activities<button type="button" aria-label="What this does" aria-expanded="{{ info.acts.exp }}" onClick="{{ info.acts.toggle }}" style="width: 44px; height: 44px; margin: -12px -10px -12px -4px; padding: 0; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: {{ info.acts.bg }}; color: {{ info.acts.fg }}; font: 600 11px 'Noto Sans Mono', monospace; display: flex; align-items: center; justify-content: center">i</span></button></h3><sc-if value="{{ info.acts.open }}" hint-placeholder-val="{{ false }}"><div role="dialog" style="position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 20; background: #2f2a27; color: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.56); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; font-family: 'Noto Sans', system-ui, sans-serif; text-transform: none; letter-spacing: normal; animation: lbPop .18s ease-out both; transform-origin: top left"><sc-for list="{{ info.acts.lines }}" as="l" hint-placeholder-count="2"><p style="margin: 0; font-size: 13px; line-height: 1.45; font-weight: 400"><b style="color: #e9b69b; font-weight: 600">{{ l.k }}:</b> {{ l.v }}</p></sc-for></div></sc-if></div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{ acts }}" as="a" hint-placeholder-count="8">
        <button type="button" aria-pressed="{{ a.on }}" style="font: inherit; font-size: 14px; border: 1px solid {{ a.line }}; background: {{ a.bg }}; color: {{ a.fg }}; border-radius: 8px; padding: 6px 11px">{{ a.name }}</button>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600; font-size: 14px">Main sport</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393330; background: #181513; color: #edeae8; border-radius: 8px; padding: 6px 11px">None</button>
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #9d5324; background: #9d5324; color: #fff; font-weight: 600; border-radius: 8px; padding: 6px 11px">Pickleball</button>
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393330; background: #181513; color: #edeae8; border-radius: 8px; padding: 6px 11px">Climbing</button>
      </div></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600; font-size: 14px">Season</span>
      <div style="display: flex; gap: 6px">
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #9d5324; background: #9d5324; color: #fff; font-weight: 600; border-radius: 8px; padding: 6px 11px">Off-season</button>
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393330; background: #181513; color: #edeae8; border-radius: 8px; padding: 6px 11px">In-season</button>
      </div></div>
    <div style="position: relative; padding-top: 18px; border-top: 1px solid #312c29"><h3 style="margin: 0; font-family: 'Ranchers', sans-serif; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center">Lifting<button type="button" aria-label="What this does" aria-expanded="{{ info.lifting.exp }}" onClick="{{ info.lifting.toggle }}" style="width: 44px; height: 44px; margin: -12px -10px -12px -4px; padding: 0; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: {{ info.lifting.bg }}; color: {{ info.lifting.fg }}; font: 600 11px 'Noto Sans Mono', monospace; display: flex; align-items: center; justify-content: center">i</span></button></h3><sc-if value="{{ info.lifting.open }}" hint-placeholder-val="{{ false }}"><div role="dialog" style="position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 20; background: #2f2a27; color: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.56); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; font-family: 'Noto Sans', system-ui, sans-serif; text-transform: none; letter-spacing: normal; animation: lbPop .18s ease-out both; transform-origin: top left"><sc-for list="{{ info.lifting.lines }}" as="l" hint-placeholder-count="2"><p style="margin: 0; font-size: 13px; line-height: 1.45; font-weight: 400"><b style="color: #e9b69b; font-weight: 600">{{ l.k }}:</b> {{ l.v }}</p></sc-for></div></sc-if></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600; font-size: 14px">Focus</span>
      <div style="display: flex; gap: 6px">
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #9d5324; background: #9d5324; color: #fff; font-weight: 600; border-radius: 8px; padding: 6px 11px">Lower</button>
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393330; background: #181513; color: #edeae8; border-radius: 8px; padding: 6px 11px">Balanced</button>
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393330; background: #181513; color: #edeae8; border-radius: 8px; padding: 6px 11px">Upper</button>
      </div></div>
    <div style="position: relative; padding-top: 18px; border-top: 1px solid #312c29"><h3 style="margin: 0; font-family: 'Ranchers', sans-serif; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center">Goal<button type="button" aria-label="What this does" aria-expanded="{{ info.goal.exp }}" onClick="{{ info.goal.toggle }}" style="width: 44px; height: 44px; margin: -12px -10px -12px -4px; padding: 0; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: {{ info.goal.bg }}; color: {{ info.goal.fg }}; font: 600 11px 'Noto Sans Mono', monospace; display: flex; align-items: center; justify-content: center">i</span></button></h3><sc-if value="{{ info.goal.open }}" hint-placeholder-val="{{ false }}"><div role="dialog" style="position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 20; background: #2f2a27; color: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.56); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; font-family: 'Noto Sans', system-ui, sans-serif; text-transform: none; letter-spacing: normal; animation: lbPop .18s ease-out both; transform-origin: top left"><sc-for list="{{ info.goal.lines }}" as="l" hint-placeholder-count="2"><p style="margin: 0; font-size: 13px; line-height: 1.45; font-weight: 400"><b style="color: #e9b69b; font-weight: 600">{{ l.k }}:</b> {{ l.v }}</p></sc-for></div></sc-if></div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393330; background: #181513; color: #edeae8; border-radius: 8px; padding: 6px 11px">Deficit only</button>
      <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #9d5324; background: #9d5324; color: #fff; font-weight: 600; border-radius: 8px; padding: 6px 11px">Recomp</button>
      <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393330; background: #181513; color: #edeae8; border-radius: 8px; padding: 6px 11px">Build</button>
    </div>
    <div style="position: relative; padding-top: 18px; border-top: 1px solid #312c29"><h3 style="margin: 0; font-family: 'Ranchers', sans-serif; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center">Body<button type="button" aria-label="What this does" aria-expanded="{{ info.body.exp }}" onClick="{{ info.body.toggle }}" style="width: 44px; height: 44px; margin: -12px -10px -12px -4px; padding: 0; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: {{ info.body.bg }}; color: {{ info.body.fg }}; font: 600 11px 'Noto Sans Mono', monospace; display: flex; align-items: center; justify-content: center">i</span></button></h3><sc-if value="{{ info.body.open }}" hint-placeholder-val="{{ false }}"><div role="dialog" style="position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 20; background: #2f2a27; color: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.56); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; font-family: 'Noto Sans', system-ui, sans-serif; text-transform: none; letter-spacing: normal; animation: lbPop .18s ease-out both; transform-origin: top left"><sc-for list="{{ info.body.lines }}" as="l" hint-placeholder-count="2"><p style="margin: 0; font-size: 13px; line-height: 1.45; font-weight: 400"><b style="color: #e9b69b; font-weight: 600">{{ l.k }}:</b> {{ l.v }}</p></sc-for></div></sc-if></div>
    <div style="display: flex; gap: 6px">
      <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #9d5324; background: #9d5324; color: #fff; font-weight: 600; border-radius: 8px; padding: 6px 11px">Female</button>
      <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393330; background: #181513; color: #edeae8; border-radius: 8px; padding: 6px 11px">Male</button>
      <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393330; background: #181513; color: #edeae8; border-radius: 8px; padding: 6px 11px">Other</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ fields }}" as="f" hint-placeholder-count="6">
        <label style="display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #a8a09c; letter-spacing: .06em; text-transform: uppercase; font-weight: 600">{{ f.label }}<input value="{{ f.value }}" placeholder="{{ f.ph }}" style="font-family: 'Noto Sans Mono', monospace; font-size: 15px; padding: 7px 8px; border: 1px solid #393330; border-radius: 8px; background: #181513; color: #edeae8; min-width: 0"></label>
      </sc-for>
    </div>
    <a href="DoneSetup.dc.html" style="display: flex; align-items: center; justify-content: center; box-sizing: border-box; text-decoration: none; width: 100%; min-height: 52px; margin-top: 4px; font: inherit; font-size: 15px; font-weight: 600; border: 1px solid #9d5324; background: #9d5324; color: #fff; border-radius: 14px">Save setup</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const on = ['Lifting', 'Pickleball', 'Climbing', 'Yoga', 'Spin'];
    const names = ['Lifting', 'Pickleball', 'Running', 'Soccer', 'Volleyball', 'Climbing', 'Yoga', 'Spin'];
    return {
      info: this.infoVals({"acts": [["Activities", "Each one gets a check-in question, plus its own tab if it has minutes to log. Lifting off hides lift days."], ["Main sport", "The sport your seasons revolve around. It decides which support lifts appear in-season."], ["Season", "Off-season builds; in-season maintains while you play more."]], "lifting": [["Focus", "Where extra sets and days go. Lower: more lower-body work. Upper: the reverse. Balanced: even."]], "goal": [["Goal", "Deficit only: fat loss first. Recomp: loss ≤0.5 lb/wk, cardio ≤25%. Build: ~200 kcal surplus, +1 set on main lifts."]], "body": [["Sex", "Changes resting metabolism and minimum weight jumps. Other uses the midpoint."], ["Age, height, weight", "Used for resting metabolism, cardio burn and protein."], ["Body fat %", "Optional. Uses lean mass for metabolism, which is more accurate if you're muscular."], ["Steps", "Daily average, added to maintenance."], ["Daily burn", "Optional wearable number. Replaces the estimate, minus 7%."]]}),
      acts: names.map((name) => on.includes(name)
        ? { name, on: 'true', bg: '#9d5324', line: '#9d5324', fg: '#ffffff' }
        : { name, on: 'false', bg: '#181513', line: '#393330', fg: '#edeae8' }),
      fields: [
        { label: 'Age', value: '', ph: '' },
        { label: 'Height (in)', value: '63', ph: '' },
        { label: 'Weight (lb)', value: '138', ph: '' },
        { label: 'Body fat %', value: '', ph: 'optional' },
        { label: 'Steps / day', value: '8000', ph: '' },
        { label: 'Daily burn', value: '', ph: 'optional' }
      ]
    };
  }
  infoVals(groups) {
    const st = this.state || {};
    const out = {};
    Object.keys(groups).forEach((k) => {
      const open = st.info === k;
      out[k] = { open, exp: open ? 'true' : 'false', ring: 'transparent', bg: open ? '#e9b69b' : '#393330', fg: open ? '#231c18' : '#d4cfcc', lines: groups[k].map(([a, b]) => ({ k: a, v: b })), toggle: () => this.setState({ info: open ? null : k }) };
    });
    return out;
  }
}
</script>
</body>
</html>
