<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lift Board · Pickleball</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ranchers&amp;family=Noto+Sans:wght@400;500;600&amp;family=Noto+Sans+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-synthesis-weight:none}
a{color:#fc96bf}a:hover{color:#ede9ea}
@keyframes lbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lbInB{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lbPop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes lbSheet{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes lbSheetOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(28px)}}
@keyframes lbFade{from{opacity:0}to{opacity:1}}
@keyframes lbFadeOut{from{opacity:1}to{opacity:0}}
@keyframes lbCheck{0%{transform:scale(.7)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes lbDraw{from{stroke-dashoffset:var(--len,60)}to{stroke-dashoffset:0}}
button,a,input,section,span,div{transition:background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease,transform .12s ease}
button:active,a:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</helmet>
<div style="width: 390px; height: 760px; box-sizing: border-box; background: #181416; color: #ede9ea; font-family: 'Noto Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.45; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; animation: lbIn .38s cubic-bezier(.2,.8,.2,1) both">
  <h1 style="margin: 0; font-family: 'Ranchers', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 34px; line-height: 1; text-transform: uppercase">Lift Board</h1>
  <nav style="display: flex; gap: 6px; padding: 8px 0; overflow: hidden" aria-label="Tabs">
    <a href="Day1.dc.html" style="flex: 0 0 auto; font-family: 'Ranchers', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; border: 1px solid transparent; background: #241f21; color: #ede9ea; padding: 7px 13px; border-radius: 999px; text-decoration: none">Day 3</a>
    <a href="Pickle.dc.html" style="flex: 0 0 auto; font-family: 'Ranchers', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; border: 1px solid #9c4a6d; background: #9c4a6d; color: #fff; padding: 7px 13px; border-radius: 999px; text-decoration: none" aria-current="page">Pickleball</a>
    <a href="Pickle.dc.html" style="flex: 0 0 auto; font-family: 'Ranchers', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; border: 1px solid transparent; background: #241f21; color: #a89fa2; padding: 7px 13px; border-radius: 999px; text-decoration: none">Yoga</a>
  </nav>
  <h2 style="margin: 0; font-family: 'Ranchers', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: .02em">Pickleball</h2>
  <section style="background: #241f21; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="position: relative"><h3 style="margin: 0; font-family: 'Ranchers', sans-serif; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: center">This week<button type="button" aria-label="What this does" aria-expanded="{{ info.week.exp }}" onClick="{{ info.week.toggle }}" style="width: 44px; height: 44px; margin: -12px -10px -12px -4px; padding: 0; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 50%; background: {{ info.week.bg }}; color: {{ info.week.fg }}; font: 600 11px 'Noto Sans Mono', monospace; display: flex; align-items: center; justify-content: center">i</span></button></h3><sc-if value="{{ info.week.open }}" hint-placeholder-val="{{ false }}"><div role="dialog" style="position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 20; background: #2f292b; color: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.56); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; font-family: 'Noto Sans', system-ui, sans-serif; text-transform: none; letter-spacing: normal; animation: lbPop .18s ease-out both; transform-origin: top left"><sc-for list="{{ info.week.lines }}" as="l" hint-placeholder-count="2"><p style="margin: 0; font-size: 13px; line-height: 1.45; font-weight: 400"><b style="color: #e9b1c5; font-weight: 600">{{ l.k }}:</b> {{ l.v }}</p></sc-for></div></sc-if></div>
    <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-weight: 600; font-size: 14px">Sessions</span>
      <div style="display: flex; gap: 6px">
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393335; background: #181416; color: #ede9ea; border-radius: 8px; padding: 6px 11px">0</button>
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393335; background: #181416; color: #ede9ea; border-radius: 8px; padding: 6px 11px">1</button>
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #9c4a6d; background: #9c4a6d; color: #fff; font-weight: 600; border-radius: 8px; padding: 6px 11px">2</button>
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393335; background: #181416; color: #ede9ea; border-radius: 8px; padding: 6px 11px">3</button>
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393335; background: #181416; color: #ede9ea; border-radius: 8px; padding: 6px 11px">4</button>
        <button type="button" style="font: inherit; font-size: 14px; border: 1px solid #393335; background: #181416; color: #ede9ea; border-radius: 8px; padding: 6px 11px">5</button>
      </div></div>
    <label style="display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #a89fa2; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; width: 120px">Planned min<input value="75" style="font-family: 'Noto Sans Mono', monospace; font-size: 15px; padding: 7px 8px; border: 1px solid #393335; border-radius: 8px; background: #181416; color: #ede9ea"></label>
  </section>
  <section style="background: #241f21; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #a89fa2">Session 1</span>
    <label style="display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #a89fa2; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; width: 160px">Actual min<input value="90" style="font-family: 'Noto Sans Mono', monospace; font-size: 15px; padding: 7px 8px; border: 1px solid #393335; border-radius: 8px; background: #181416; color: #ede9ea"></label>
  </section>
  <section style="background: #241f21; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #a89fa2">Session 2</span>
    <label style="display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #a89fa2; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; width: 160px">Actual min<input placeholder="75" style="font-family: 'Noto Sans Mono', monospace; font-size: 15px; padding: 7px 8px; border: 1px solid #393335; border-radius: 8px; background: #181416; color: #ede9ea"></label>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return { info: this.infoVals({"week": [["Sessions", "Counts toward cardio and recovery load. Long weeks trim overlapping leg sets."], ["Planned min", "Default length per session. Log actual minutes below and the plan updates."]]}) }; }
  infoVals(groups) {
    const st = this.state || {};
    const out = {};
    Object.keys(groups).forEach((k) => {
      const open = st.info === k;
      out[k] = { open, exp: open ? 'true' : 'false', ring: 'transparent', bg: open ? '#e9b1c5' : '#393335', fg: open ? '#231b1e' : '#d4cfd0', lines: groups[k].map(([a, b]) => ({ k: a, v: b })), toggle: () => this.setState({ info: open ? null : k }) };
    });
    return out;
  }

}
</script>
</body>
</html>
